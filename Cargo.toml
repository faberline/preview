[workspace]
resolver = "2"
members = ["."]

[workspace.package]
version = "0.4.13"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/preview"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
anyhow = "1.0"
clap = { version = "4", features = ["derive", "string"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[package]
name = "preview"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MR-scoped UAT preview environments for GKE: namespace projection, route bindings, and lifecycle dry-runs"

[lib]
name = "preview"
path = "src/lib.rs"

[[bin]]
name = "preview"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
tempfile = "3"
